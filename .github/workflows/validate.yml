name: Validate
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate
        required: false
        type: string
      ref:
        description: Branch or commit to validate when no release tag is supplied
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Show build environment
        shell: pwsh
        run: |
          dotnet --info
          cmake --version
          $PSVersionTable.PSVersion
      - name: Configure checked-out sources
        shell: pwsh
        run: cmake --preset vs18-x64 -DBUILD_TESTING=ON
      - name: Build native self tests
        shell: pwsh
        run: cmake --build obj/vs18-x64 --config ${{ matrix.configuration }} --target vmex_tests vmex_manager_ui_tests vmex
      - name: Run Core and management self tests
        shell: pwsh
        run: ctest --test-dir obj/vs18-x64 -C ${{ matrix.configuration }} --output-on-failure --output-junit test-results.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: machine-test-reports-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            obj/vs18-x64/test-results.xml
            obj/vs18-x64/Testing/Temporary/
            obj/vs18-x64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
