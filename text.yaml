recording.info.title: 录制模式说明
recording.info: 部分录制软件可能将当前输出设备的音量和音效处理一并录入，造成音量或音效的重复叠加。录制模式通过 VB-CABLE 提供未经实体输出设备 APO 后期处理的纯净音频流。\n\n开启后，系统默认输出切换到 VB-CABLE，声音仍会通过当前实体设备供你监听。实体设备的音量和 APO 音效只影响监听，不进入录制链路。\n\n如果录制软件支持选择音频设备，请将录制源设为 VB-CABLE。麦克风继续选择实体输入设备。\n\n关闭录制模式后，会恢复默认输出设备及相关应用的音频路由。
