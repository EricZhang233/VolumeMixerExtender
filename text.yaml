recording.endpoint.notReady: CABLE Input 不可用或无法确认其硬件归属，请检查 VB-CABLE 配置。
recording.format.notReady: 无法打开音频端点或读取混音格式，请检查音频服务和设备配置。
recording.driver.missing: 未安装 VB-CABLE，请在管理器中安装录制驱动。
recording.driver.notReady: VB-CABLE 的 CABLE Input 尚未就绪，请检查驱动状态并在安装后重启 Windows。
recording.monitor.physicalRequired: 请先将实体输出设备设为默认，再开启录制模式。
