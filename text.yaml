skill.title: VolumeMixerExtender 接入文档
skill.section.purpose: 用途
skill.purpose.text: 通过命令行完整驱动快速设置音量面板的注入入口与自定义声音页面, 不依赖图形界面。
skill.section.workflow: 工作流
skill.workflow.text: 确认 ShellHost 就绪后执行 inject, 随后可查询状态并驱动音频端点与会话。
